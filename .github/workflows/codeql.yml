name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]  # Change to your default branch name
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * 1'  # Weekly scan on Mondays

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write  # Allows comments on PRs

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]  # Covers JS, TS, HTML
        # Note: CodeQL treats JavaScript and TypeScript together

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Optional: Add custom queries for enhanced security checks
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
